name: Stats cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=andrezzarosa&show_icons=true&hide_border=true&bg_color=0D1117&title_color=F2305F&icon_color=0EC6BA&text_color=EAEAEA&ring_color=FFAB16
          path: .github/cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=andrezzarosa&layout=compact&hide_border=true&bg_color=0D1117&title_color=F2305F&text_color=EAEAEA&langs_count=6
          path: .github/cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/cards/*.svg
          git commit -m "Update stats cards - [Skip GitHub Action]" || exit 0
          git push
