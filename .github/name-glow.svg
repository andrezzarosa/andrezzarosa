<svg xmlns="http://www.w3.org/2000/svg" width="620" height="110" viewBox="0 0 620 110">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2305F"/>
      <stop offset="50%" stop-color="#FEA862"/>
      <stop offset="100%" stop-color="#28BEC5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="310" y="65" font-family="Fira Code, monospace" font-size="52" font-weight="700" fill="url(#nameGrad)" text-anchor="middle" filter="url(#glow)">Andrezza Rosa</text>
  <text x="310" y="98" font-family="Fira Code, monospace" font-size="20" fill="url(#nameGrad)" text-anchor="middle" opacity="0.9">✨ 🧜‍♀️ ✨</text>
</svg>
